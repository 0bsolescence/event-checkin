# Pinned from documentation knowledge, NOT resolved against a repository on
# this machine (no Android SDK / Gradle here). If a version fails to resolve,
# bump to the nearest available — nothing in the app depends on these exact
# numbers.
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activity" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
